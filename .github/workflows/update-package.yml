name: Update complete website package

on:
  push:
    branches: [main]
    paths-ignore:
      - AnNoor_Payments.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: annoor-package-main
  cancel-in-progress: true

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Install locked validation dependencies
        run: npm ci --no-audit --no-fund
      - name: Install locked classroom dependencies
        working-directory: live-class
        run: npm ci --no-audit --no-fund
      - name: Install locked receipt dependencies
        working-directory: payment-module
        run: npm ci --no-audit --no-fund
      - name: Build both public applications
        run: npm run build
      - name: Validate security, data preservation and website behavior
        run: npm run check
      - name: Stage the generated applications
        run: git add -A -- live/ payments/
      - name: Import or build the complete ZIP
        run: python3 scripts/package-release.py
      - name: Commit the verified package
        run: |
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update complete An-Noor website package [skip ci]'
          git push origin HEAD:main
