name: Update complete website package

on:
  push:
    branches: [main]
    paths-ignore:
      - AnNoor_Payments.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: annoor-package-main
  cancel-in-progress: true

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: main
          fetch-depth: 0
      - name: Detect application source changes
        id: changes
        env:
          PREVIOUS_COMMIT: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          before = os.environ.get('PREVIOUS_COMMIT', '')
          all_apps = os.environ['EVENT_NAME'] == 'workflow_dispatch' or not before.strip('0')
          paths = [] if all_apps else subprocess.check_output(['git', 'diff', '--name-only', before, 'HEAD']).decode().splitlines()
          shared = all_apps or any(p.startswith(('shared/', '.github/workflows/')) for p in paths)
          live = shared or any(p.startswith('live-class/') for p in paths)
          payments = shared or any(p.startswith('payment-module/') for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'live={str(live).lower()}\npayments={str(payments).lower()}\n')
          PY
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.changes.outputs.live == 'true' || steps.changes.outputs.payments == 'true'
        with:
          node-version: '24.19.0'
      - name: Build live classroom
        if: steps.changes.outputs.live == 'true'
        working-directory: live-class
        run: npm ci --no-audit --no-fund && npm run build
      - name: Build receipt interface
        if: steps.changes.outputs.payments == 'true'
        working-directory: payment-module
        run: npm ci --no-audit --no-fund && npm run build
      - name: Stage the generated applications
        run: git add -A -- live/ payments/
      - name: Import or build the complete ZIP
        run: python3 scripts/package-release.py
      - name: Commit the verified package
        run: |
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update complete An-Noor website package [skip ci]'
          git push origin HEAD:main
