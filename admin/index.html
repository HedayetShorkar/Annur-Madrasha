<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>অফিস ব্যবস্থাপনা | An-Noor</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:#163b30;font:16px/1.65 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:1px solid #d7e4da;padding-bottom:22px}img{width:64px;height:64px;object-fit:contain}h1{font-size:clamp(23px,4vw,34px);margin:0}small{color:#52685e}.card,article{background:white;border:1px solid #dbe5de;border-radius:18px;padding:24px;margin:20px 0;box-shadow:0 8px 35px #173a2310}#login{max-width:480px;margin:45px auto}label{display:block;margin:14px 0 6px}input,select,textarea,button{font:inherit;min-height:46px;border-radius:10px;border:1px solid #b8cbbf;padding:10px;max-width:100%}input,textarea{width:100%}button{background:#07563f;color:#fff;border:0;cursor:pointer}button:disabled{opacity:.5;cursor:default}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:20px 0}.toolbar button{flex-shrink:0}#message{white-space:pre-wrap;overflow-wrap:anywhere}dl{display:grid;grid-template-columns:minmax(100px,1fr) minmax(0,3fr);gap:10px}dt{color:#63786b}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}summary{cursor:pointer;font-weight:bold;padding:10px 0}#logout{margin-left:auto}.status{background:#e5f4ec;border-radius:20px;padding:4px 12px;font-size:14px}a{color:#07563f}article h2,article p,.audit{overflow-wrap:anywhere}.audit{white-space:pre-wrap;font-size:14px}[hidden]{display:none!important}@media(max-width:500px){main{padding:14px}.card,article{padding:16px}dl{grid-template-columns:1fr;gap:4px}dd{margin-bottom:12px}}
</style><main><header><img src="../assets/images/brand-asset-1.webp" alt="An-Noor"><div><small>AN-NOOR · OFFICE</small><h1>আবেদন ও মতামত ব্যবস্থাপনা</h1></div><button id="logout" hidden>লগআউট</button></header><p id="message" role="status" tabindex="-1"></p><form class="card" id="login"><h2>অফিস লগইন</h2><p>প্রতিষ্ঠান থেকে অনুমোদিত অ্যাডমিন অ্যাকাউন্ট প্রয়োজন। শিক্ষার্থীর ক্লাস আইডি এখানে প্রযোজ্য নয়।</p><label for="email">ইমেইল</label><input id="email" type="email" autocomplete="username" required><label for="password">পাসওয়ার্ড</label><input id="password" type="password" autocomplete="current-password" required><button style="margin-top:20px" id="signin">প্রবেশ করুন</button></form><section id="office" hidden><div class="toolbar"><label for="module">বিভাগ</label><select id="module"><option value="ADMISSION">ভর্তি আবেদন</option><option value="TRIAL">ফ্রি ট্রায়ালের অনুরোধ</option><option value="REVIEW">অভিভাবকদের মতামত</option></select><label for="filter">অবস্থা</label><select id="filter"><option value="">সকল আবেদন</option><option value="SUBMITTED">নতুন আবেদন</option><option value="IN_REVIEW">পর্যালোচনায়</option><option value="APPROVED">অনুমোদিত</option><option value="REJECTED">বাতিল</option></select><button id="refresh">তালিকা দেখুন</button><span id="total"></span></div><p id="office-note">অনুমোদন আবেদন পর্যালোচনার সিদ্ধান্ত। এটি পেমেন্ট নিশ্চিত করে না এবং স্বয়ংক্রিয়ভাবে লাইভ ক্লাসের আইডি বা ব্যাচ বরাদ্দ করে না।</p><div id="list"></div><div class="toolbar"><button id="prev">আগের পাতা</button><button id="next">পরের পাতা</button></div></section><p><a href="../index.html">← ওয়েবসাইটে ফিরুন</a></p></main><script src="../assets/js/backend-config.js"></script><script>
(()=>{'use strict';
 const $=id=>document.getElementById(id),cfg=window.AnNoorBackend;let token='',offset=0,expiry=0,revision=0;
 const labels={SUBMITTED:'নতুন আবেদন',IN_REVIEW:'পর্যালোচনায়',PENDING:'অনুমোদনের অপেক্ষায়',APPROVED:'অনুমোদিত',REJECTED:'বাতিল / প্রত্যাহার'};
 const tell=s=>{$('message').textContent=s;},kind=()=>$('module').value,prefix=k=>k==='ADMISSION'?'':k.toLowerCase()+'-';
 function node(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;}
 function clear(){revision++;token='';clearTimeout(expiry);$('office').hidden=true;$('logout').hidden=true;$('login').hidden=false;$('list').replaceChildren();$('password').value='';}
 async function api(action,body){
  const r=await fetch(cfg.url+'/functions/v1/admissions/'+action,{method:'POST',headers:{apikey:cfg.publishableKey,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();
  if(!r.ok){if(r.status===401||r.status===403)clear();throw Error(d.error==='FORBIDDEN'?'এই অ্যাকাউন্টে অ্যাডমিন অনুমতি নেই।':d.error==='CONFLICT'?'অন্য কেউ তথ্যটি পরিবর্তন করেছেন। তালিকা আবার খুলুন।':'কাজটি সম্পন্ন হয়নি। আবার চেষ্টা করুন।');}return d;
 }
 function filters(){
  $('filter').replaceChildren();for(const status of (kind()==='REVIEW'?['','PENDING','APPROVED','REJECTED']:['','SUBMITTED','IN_REVIEW','APPROVED','REJECTED'])){const o=node('option',status?(kind()==='REVIEW'&&status==='APPROVED'?'প্রকাশিত':labels[status]):'সকল রেকর্ড');o.value=status;$('filter').append(o);}
  $('office-note').textContent=kind()==='REVIEW'?'শুধু প্রকাশের সম্মতিসহ অনুমোদিত মতামত ওয়েবসাইটে দেখা যাবে। প্রকাশ প্রত্যাহার করলেও ইতিহাস থাকবে।':kind()==='TRIAL'?'ট্রায়ালের অনুরোধ বিনামূল্যে। অনুমোদন নিজে থেকে ক্লাস, আসন বা ক্লাস আইডি বরাদ্দ করে না; সময় সমন্বয় করে নিশ্চিত করতে হবে।':'অনুমোদন আবেদন পর্যালোচনার সিদ্ধান্ত। এটি পেমেন্ট নিশ্চিত করে না এবং স্বয়ংক্রিয়ভাবে লাইভ ক্লাসের আইডি বা ব্যাচ বরাদ্দ করে না।';
 }
 function rows(k,row){
  const a=row.data,created=['জমার সময়',new Date(row.created_at).toLocaleString('bn-BD')];
  if(k==='REVIEW')return [['অভিভাবক',a.guardian_name],['দেশ',a.country],['মূল্যায়ন',a.rating===null?'উল্লেখ করা হয়নি':a.rating+' / 5'],['মতামত',a.review],['প্রকাশের সম্মতি',a.publish_consent===true?'আছে':'নেই'],['প্রকাশের সময়',row.published_at?new Date(row.published_at).toLocaleString('bn-BD'):'—'],created];
  if(k==='TRIAL')return [['শিক্ষার্থী',a.student_name],['বয়স',a.age],['অভিভাবক',a.guardian_name],['হোয়াটসঅ্যাপ',a.phone],['বর্তমান স্তর',a.level],['পছন্দের সময়',a.preferred_time||'আলোচনা করে ঠিক হবে'],['আবেদনের ধরন','দুটি ফ্রি ট্রায়াল ক্লাসের অনুরোধ'],created];
  return [['বয়স / লিঙ্গ',a.age+' / '+a.gender],['ঠিকানা',a.address],['পাঠের স্তর',a.level],['হিফজ',a.hifz||'—'],['অভিভাবক',a.guardian_name],['সম্পর্ক',a.relationship],['হোয়াটসঅ্যাপ',a.phone],['ইমেইল',a.email||'—'],['প্যাকেজ',a.plan],['পছন্দের শুরু',a.start_date],['সময়',a.availability.mode==='flexible'?'আলোচনা করে ঠিক হবে':a.availability.start+'–'+a.availability.end+' · '+a.availability.timeZone],['অতিরিক্ত কথা',a.notes||'—'],['ফি নির্ধারণের দিন',row.fee_date],['প্রথম মাসের প্রাথমিক ফি','৳'+(row.fee_bdt_minor/100).toFixed(2)],created];
 }
 function render(k,row){
  const article=node('article'),heading=node('h2',k==='REVIEW'?row.data.guardian_name:row.data.student_name),badge=node('span',k==='REVIEW'&&row.status==='APPROVED'?'প্রকাশিত':labels[row.status]);badge.className='status';article.append(heading,badge,node('p',row.reference));
  const details=node('details'),summary=node('summary','তথ্য ও সিদ্ধান্ত দেখুন'),dl=node('dl');for(const [label,value]of rows(k,row))dl.append(node('dt',label),node('dd',String(value)));details.append(summary,dl);
  if(k!=='ADMISSION'||row.status!=='APPROVED'){
   const form=node('form'),select=node('select');select.setAttribute('aria-label','সিদ্ধান্ত');
   const statuses=k==='REVIEW'?['APPROVED','REJECTED','PENDING']:['IN_REVIEW','APPROVED','REJECTED'];
   for(const status of statuses.filter(x=>x!==row.status)){const o=node('option',k==='REVIEW'&&status==='APPROVED'?'অনুমোদন ও প্রকাশ':labels[status]);o.value=status;select.append(o);}
   const label=node('label','সিদ্ধান্তের কারণ / নোট'),reason=node('textarea'),save=node('button','সিদ্ধান্ত সংরক্ষণ');reason.required=true;reason.minLength=5;reason.maxLength=1000;label.append(reason);form.append(select,label,save);
   form.addEventListener('submit',async event=>{event.preventDefault();if(reason.value.trim().length<5)return;save.disabled=true;try{const body={id:row.id,status:select.value,reason:reason.value};if(k==='ADMISSION')body.expected_status=row.status;else body.expected_version=row.version;await api(prefix(k)+'decide',body);tell('সিদ্ধান্ত সংরক্ষিত হয়েছে।');await load();}catch(error){tell(error.message);}finally{save.disabled=false;}});details.append(form);
  }
  const audit=node('button','পর্যালোচনার ইতিহাস'),history=node('div');history.className='audit';audit.type='button';audit.addEventListener('click',async()=>{audit.disabled=true;try{const rows=await api(prefix(k)+'audit',{id:row.id});history.replaceChildren(...rows.map(x=>node('p',new Date(x.created_at).toLocaleString('bn-BD')+' · '+labels[x.new_status]+' · '+x.reason)));}catch(error){tell(error.message);}finally{audit.disabled=false;}});details.append(audit,history);article.append(details);return article;
 }
 async function load(){
  if(!token)return;const current=++revision,k=kind(),at=offset;$('refresh').disabled=true;
  try{const data=await api(prefix(k)+'list',{status:$('filter').value,offset:at});if(current!==revision||k!==kind()||!token)return;$('list').replaceChildren(...data.items.map(row=>render(k,row)));$('total').textContent='মোট '+data.total+'টি';$('prev').disabled=at===0;$('next').disabled=at+25>=data.total;if(!data.items.length)$('list').append(node('p','এই অবস্থায় কোনো রেকর্ড নেই।'));}
  catch(error){if(current===revision)tell(error.message);}finally{if(current===revision)$('refresh').disabled=false;}
 }
 $('login').addEventListener('submit',async event=>{
  event.preventDefault();if(location.protocol==='file:'){tell('লগইনের জন্য পেজটি HTTPS ওয়েবসাইট থেকে খুলতে হবে।');return;}$('signin').disabled=true;tell('প্রবেশ যাচাই হচ্ছে…');
  try{const r=await fetch(cfg.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:cfg.publishableKey,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})}),data=await r.json();$('password').value='';if(!r.ok||!data.access_token)throw Error('ইমেইল ও পাসওয়ার্ড যাচাই করুন।');token=data.access_token;await api('list',{offset:0});expiry=setTimeout(()=>{clear();tell('সেশনের মেয়াদ শেষ। আবার লগইন করুন।');},Math.min(data.expires_in||3600,3600)*1000);$('login').hidden=true;$('office').hidden=false;$('logout').hidden=false;tell('অফিসে স্বাগতম।');offset=0;filters();await load();}
  catch(error){clear();tell(error.message);}finally{$('signin').disabled=false;}
 });
 $('logout').addEventListener('click',async()=>{const old=token;clear();tell('লগআউট হয়েছে।');try{await fetch(cfg.url+'/auth/v1/logout',{method:'POST',headers:{apikey:cfg.publishableKey,Authorization:'Bearer '+old}});}catch{}});
 $('module').addEventListener('change',()=>{offset=0;filters();load();});$('refresh').addEventListener('click',()=>{offset=0;load();});$('filter').addEventListener('change',()=>{offset=0;load();});$('prev').addEventListener('click',()=>{offset=Math.max(0,offset-25);load();});$('next').addEventListener('click',()=>{offset+=25;load();});filters();
})();

</script></html>
